<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1319">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="익선취향">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>익선취향</title>
<style>
  :root{
    --ink:#0f1319;
    --panel:#161b22;
    --panel2:#1c222b;
    --line:#252c36;
    --text:#f0f3f6;
    --dim:#8792a0;
    --wait:#e8b757;
    --go:#5fb08a;
    --off:#3d4653;
    --warn:#c9736a;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ink)}
  html{min-height:100%}
  body{min-height:100vh;min-height:100dvh}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",system-ui,sans-serif;
    font-size:16px;
    line-height:1.4;
    padding:0 0 calc(112px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 14px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* header */
  header{
    position:sticky;top:0;z-index:20;
    background:var(--ink);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 0 8px;
  }
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px}
  .nav{display:flex;align-items:center;gap:0;margin-left:-10px}
  .nav button{
    width:38px;height:38px;flex:0 0 auto;padding:0;
    display:grid;place-items:center;
    background:none;border:0;color:var(--dim);
    line-height:0;cursor:pointer;border-radius:9px;
  }
  .nav button svg{display:block}
  .nav button:active{background:var(--panel2)}
  .nav button:disabled{opacity:.22}
  .date{font-size:13.5px;color:var(--text);font-weight:650;letter-spacing:.01em;white-space:nowrap}
  .offday .date{color:var(--wait);font-weight:700}
  .offday .nav button{color:var(--wait)}
  .dayprog{
    display:flex;align-items:center;line-height:1;
    font-size:13.5px;font-weight:800;color:var(--text);
    background:var(--panel);border:1px solid var(--line);
    padding:4px 9px;border-radius:8px;
  }
  .dayprog.full{color:var(--go);border-color:#26382f}
  .tools{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .tools button.off{visibility:hidden;pointer-events:none}
  .tools button{
    width:38px;height:38px;flex:0 0 auto;
    display:grid;place-items:center;
    background:none;border:0;border-radius:9px;
    color:var(--dim);cursor:pointer;margin-right:-8px;
  }
  .tools button:active{background:var(--panel2)}
  .tools button.on{color:var(--wait);background:var(--panel2)}
  .sync{font-size:11.5px;color:var(--warn);display:flex;align-items:center;gap:5px;font-weight:600;line-height:1;height:38px}
  .sync.ok{color:var(--dim);font-weight:500}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--go);opacity:.9}
  .dot.stale{background:var(--warn)}

  .lead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:8px}
  .lead.hide{display:none}
  .slotlab{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--dim)}
  .slottime{font-size:22px;font-weight:800;color:var(--wait);letter-spacing:-.03em}
  .leadmain{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.02em}
  .leadmain.done{font-size:16px;font-weight:650;color:var(--go)}
  .leadsub{font-size:13.5px;font-weight:600;color:var(--dim);display:inline}
  .leadsub .pc{white-space:nowrap}
  .leadsub .pcsep{color:var(--off)}

  /* search */
  .searchbar{position:relative;margin-top:12px}
  .searchbar.hide{display:none}
  .searchbar input{
    width:100%;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:11px;
    padding:11px 74px 11px 13px;font-family:inherit;font-size:16px;
    -webkit-appearance:none;appearance:none;
  }
  .qcount{
    position:absolute;right:40px;top:50%;transform:translateY(-50%);
    font-size:12.5px;font-weight:700;color:var(--dim);
    font-variant-numeric:tabular-nums;pointer-events:none;
  }
  .qcount.zero{color:var(--warn)}
  .searchbar input::placeholder{color:var(--dim)}
  .searchbar input:focus{outline:2px solid var(--wait);outline-offset:-1px}
  .searchbar input::-webkit-search-cancel-button{display:none}
  .searchbar button{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border:0;border-radius:9px;
    background:none;color:var(--dim);cursor:pointer;
    display:grid;place-items:center;line-height:0;padding:0;
  }
  .searchbar button svg{display:block}
  .searchbar button:active{background:var(--panel2)}
  mark{background:#463a13;color:var(--wait);-webkit-text-fill-color:var(--wait);border-radius:3px;padding:0 1px}

  /* time group */
  .group{margin-top:10px}
  .ghead{
    position:sticky;top:var(--hh,84px);z-index:10;
    background:var(--ink);
    display:flex;align-items:center;gap:7px;
    width:calc(100% + 28px);margin:0 -14px;padding:9px 16px 8px;
    border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;
  }
  .ghead:active{background:var(--panel2)}
  .chev{
    color:var(--dim);flex:0 0 auto;
    display:grid;place-items:center;width:14px;height:14px;line-height:0;
    transform:rotate(90deg);transition:transform .15s;
  }
  .chev svg{display:block}
  .group.shut .chev{transform:rotate(0)}
  .gtime{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--dim)}
  .gline{flex:1;height:1px;background:var(--line)}
  .gmeta{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:7px}
  .gmeta b{font-weight:800;color:var(--text)}
  .gbreak{color:var(--dim);font-size:11.5px}
  .group.now .gtime{color:var(--wait)}
  .group.now .row{border-left-color:var(--wait)}
  .group.done .gtime{opacity:.6}
  .group.done .gmeta b{color:var(--go)}

  /* row */
  .row{
    display:flex;align-items:stretch;gap:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:8px;
    overflow:hidden;
    transition:border-color .15s,opacity .15s,background .15s;
  }
  .main{
    flex:1;display:flex;align-items:center;gap:12px;
    padding:14px 12px;min-height:60px;cursor:pointer;
    background:none;border:0;color:inherit;font:inherit;text-align:left;
  }
  .main:active{background:var(--panel2)}
  .check{
    width:28px;height:28px;border-radius:9px;flex:0 0 auto;
    border:2px solid var(--off);
    display:grid;place-items:center;
    font-size:15px;font-weight:800;line-height:1;color:transparent;
    transition:.15s;
  }
  .who{flex:1;min-width:0;display:flex;align-items:center}
  .name{
    display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;
    color:var(--text);-webkit-text-fill-color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tag{
    font-size:11.5px;font-weight:800;letter-spacing:.04em;
    padding:4px 8px;border-radius:7px;flex:0 0 auto;white-space:nowrap;
  }
  .tag.arrived{background:#1b2f27;color:#7fc9a5;-webkit-text-fill-color:#7fc9a5}
  .tag.cancelled{background:#332323;color:#d2938c;-webkit-text-fill-color:#d2938c}
  .pax{
    font-size:15px;font-weight:750;color:var(--text);
    background:var(--panel2);border-radius:8px;padding:5px 9px;flex:0 0 auto;
  }
  .more{
    width:44px;flex:0 0 auto;border:0;border-left:1px solid var(--line);
    background:none;color:var(--dim);cursor:pointer;
    display:grid;place-items:center;line-height:0;padding:0;
  }
  .more svg{display:block}
  .more:active{background:var(--panel2)}

  .row.arrived{border-left-color:var(--go);background:#141d19}
  .row.arrived .check{background:var(--go);border-color:var(--go);color:#08241a;-webkit-text-fill-color:#08241a}
  .row.arrived .name{color:#94a49c;-webkit-text-fill-color:#94a49c;font-weight:600}
  .row.arrived .pax{color:var(--go);-webkit-text-fill-color:var(--go)}

  .row.cancelled{border-left-color:var(--warn);background:#1a1618}
  .row.cancelled .name{color:#b8938e;-webkit-text-fill-color:#b8938e;font-weight:600}
  .row.cancelled .pax{color:#a8837e;-webkit-text-fill-color:#a8837e;background:#241c1d}
  .row.cancelled .check{
    border-color:var(--warn);
    color:var(--warn);-webkit-text-fill-color:var(--warn);
    font-size:15px;font-weight:800;line-height:1;
  }


  .edit{padding:0 10px 11px}
  .erow{display:flex;gap:6px}
  .erow label{
    display:flex;flex-direction:column;gap:4px;
    font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--dim);
  }
  .erow label.grow{flex:1;min-width:0}
  .erow input, .erow select{
    background:var(--ink);color:var(--text);
    border:1px solid var(--line);border-radius:9px;
    padding:10px 9px;font-family:inherit;font-size:16px;font-weight:600;
    font-variant-numeric:tabular-nums;width:100%;min-width:0;height:44px;
    -webkit-appearance:none;appearance:none;
  }
  .erow input:focus, .erow select:focus{outline:2px solid var(--wait);outline-offset:-1px}
  .erow select{
    text-align:center;text-align-last:center;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 14px) 20px, calc(100% - 9px) 20px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
    padding-right:22px;
  }
  .erow #e-hour, .erow #e-min{width:64px}
  .erow #e-pax{width:80px}
  .ebtn{display:flex;gap:6px;margin-top:7px}
  .ebtn button{
    flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-family:inherit;font-size:13.5px;font-weight:650;cursor:pointer;
  }
  .ebtn #e-ok{background:var(--wait);color:#241a05;border-color:var(--wait)}
  .ebtn button:active{filter:brightness(.9)}

  .menu{display:flex;gap:6px;padding:0 10px 10px}
  .menu button{
    flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .menu button:active{background:#26313d}
  .menu .del{color:var(--warn)}

  /* paste panel */
  .panel.asSheet{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);
    z-index:71;width:100%;max-width:520px;margin:0;
    border-radius:18px 18px 0 0;border-bottom:0;
    max-height:86vh;overflow-y:auto;
    padding-bottom:calc(env(safe-area-inset-bottom) + 16px);
  }
  .panelScrim{position:fixed;inset:0;z-index:70;background:rgba(6,9,13,.72)}
  .panelScrim.hide{display:none}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-top:10px;overflow:hidden;
  }
  .panel h2{margin:0 0 4px;font-size:16px;font-weight:700}
  .panel p{margin:0 0 10px;font-size:12.5px;color:var(--dim);line-height:1.5}
  .tawrap{position:relative}
  .tawrap textarea, .hl{
    font-family:inherit;font-size:16px;line-height:1.65;
    font-variant-numeric:tabular-nums;
    padding:11px;border:1px solid transparent;border-radius:10px;
    letter-spacing:0;
    white-space:pre-wrap;word-break:break-all;overflow-wrap:break-word;
  }
  textarea{
    position:relative;z-index:1;
    display:block;width:100%;box-sizing:border-box;
    resize:none;overflow:hidden;
    background:transparent;color:var(--text);
    border-color:var(--line);
    -webkit-appearance:none;appearance:none;
  }
  .hl{
    position:absolute;inset:0;z-index:0;
    background:var(--ink);border-radius:10px;
    color:transparent;-webkit-text-fill-color:transparent;
    overflow:hidden;pointer-events:none;
    padding:11px 0;
  }
  .hl .ln{display:block;padding:0 11px 0 11px}
  .hl .ln.err{
    background:rgba(201,115,106,.16);
    box-shadow:inset 3px 0 0 var(--warn);
  }
  textarea:focus{outline:2px solid var(--wait);outline-offset:-1px}
  .badbox{
    margin-top:9px;padding:9px 11px;
    background:#1e1618;border:1px solid #4a2e2c;border-radius:9px;
    font-size:13.5px;line-height:1.5;color:#e0a49d;font-weight:600;
  }
  .badbox.hide{display:none}

  .btns{display:flex;gap:8px;margin-top:12px}
  .btn{
    flex:1;padding:13px 0;border-radius:11px;border:0;
    font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
  }
  .btn.primary{background:var(--wait);color:#221703}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn:active{filter:brightness(.9)}
  textarea::placeholder{ color:#6b7784 }

  /* footer */
  .foot.hide{display:none}
  .foot{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(15,19,25,.96);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  }
  .foot .inner{max-width:640px;margin:0 auto}
  .frow{display:flex;gap:7px}
  .frow + .frow{margin-top:6px}
  .foot button{
    flex:1;padding:12px 0;border-radius:11px;
    border:1px solid var(--line);background:var(--panel);
    color:var(--text);font-family:inherit;font-size:15px;font-weight:650;cursor:pointer;
  }
  .foot .frow.sub button{
    padding:9px 0;font-size:12.5px;font-weight:550;
    background:none;color:var(--dim);border-color:transparent;
  }
  .foot button:active{background:var(--panel2)}

  .empty{text-align:center;color:var(--dim);font-size:13.5px;padding:36px 10px;line-height:1.7;white-space:pre-line}
  /* ---------- 메뉴 서랍 ---------- */
  .drawerScrim{
    position:fixed;inset:0;z-index:60;background:rgba(6,9,13,.6);
    opacity:1;transition:opacity .2s;
  }
  .drawerScrim.hide{opacity:0;pointer-events:none}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;z-index:61;
    width:min(68vw, 258px);
    background:var(--panel);border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 18px) 0 calc(env(safe-area-inset-bottom) + 14px);
    transform:translateX(-101%);transition:transform .22s ease;
    display:flex;flex-direction:column;overflow-y:auto;
  }
  .drawer.open{transform:translateX(0)}
  .dwtitle{padding:0 18px 14px;font-size:17px;font-weight:800;letter-spacing:-.02em}
  .dwdays{display:flex;flex-direction:column}
  .dwday{
    display:flex;align-items:center;gap:10px;
    padding:13px 18px;border:0;background:none;cursor:pointer;
    color:var(--dim);font-family:inherit;font-size:14.5px;font-weight:600;text-align:left;
  }
  .dwday:active{background:var(--panel2)}
  .dwday .d1{flex:1;min-width:0;white-space:nowrap}
  .dwday .d2{font-size:12.5px;font-variant-numeric:tabular-nums}
  .dwday.on{color:var(--text)}
  .dwday.on .d1{font-weight:800}
  .dwday .tick{width:14px;flex:0 0 auto;color:var(--wait)}
  .dwsep{height:1px;background:var(--line);margin:10px 18px}
  .dwitem{
    padding:13px 18px;border:0;background:none;cursor:pointer;
    color:var(--text);font-family:inherit;font-size:14.5px;font-weight:600;text-align:left;
  }
  .dwitem:active{background:var(--panel2)}
  .dwfoot{
    padding:12px 18px 0;
    font-size:12.5px;font-weight:600;color:var(--dim);
    display:flex;align-items:center;gap:6px;
  }
  .dwfoot.off{color:var(--warn)}

  /* ---------- 안내 시트 ---------- */
  .sheetScrim{
    position:fixed;inset:0;z-index:70;background:rgba(6,9,13,.72);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheetScrim.hide{display:none}
  .sheet{
    width:100%;max-width:520px;
    background:var(--panel);border:1px solid var(--line);border-bottom:0;
    border-radius:18px 18px 0 0;
    padding:20px 18px calc(env(safe-area-inset-bottom) + 16px);
    max-height:82vh;overflow-y:auto;
  }
  .sheet h3{margin:0 0 14px;font-size:17px;font-weight:800;letter-spacing:-.02em}
  .qa{margin:0 0 18px}
  .qa .q{font-size:14.5px;font-weight:700;color:var(--wait);margin-bottom:6px}
  .qa .a{font-size:14px;line-height:1.65;color:var(--dim);white-space:pre-line}
  .howto{margin:0 0 16px}
  .howto .h{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:5px}
  .howto .s{font-size:14px;line-height:1.6;color:var(--dim)}
  .howto .s b{color:var(--text);font-weight:600}
  .sheetNote{font-size:13px;line-height:1.6;color:var(--go);margin:0 0 14px}
  .sheetClose{
    width:100%;padding:13px 0;margin-top:2px;border-radius:11px;
    border:1px solid var(--line);background:var(--panel2);
    color:var(--text);font-family:inherit;font-size:15px;font-weight:650;cursor:pointer;
  }

  .scrim{
    position:fixed;inset:0;z-index:50;
    background:rgba(6,9,13,.72);
    display:grid;place-items:center;padding:22px;
  }
  .scrim.hide{display:none}
  .dialog{
    width:100%;max-width:330px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:19px 18px 15px;
  }
  .dialog h3{margin:0 0 13px;font-size:17px;font-weight:750;letter-spacing:-.01em;line-height:1.45;white-space:pre-line}
  .dialog input{
    width:100%;background:var(--ink);color:var(--text);
    border:1px solid var(--line);border-radius:10px;
    padding:12px 13px;font-family:inherit;font-size:16px;font-weight:600;
    text-align:center;-webkit-appearance:none;appearance:none;
  }
  .dialog input::placeholder{color:#4b5663;font-weight:400}
  .dialog input:focus{outline:2px solid var(--wait);outline-offset:-1px}
  .dbtn{display:flex;gap:8px;margin-top:11px}
  .dbtn button{
    flex:1;padding:12px 0;border-radius:11px;
    border:1px solid var(--line);background:var(--panel2);
    color:var(--text);font-family:inherit;font-size:15px;font-weight:650;cursor:pointer;
  }
  .dbtn #dlgYes{background:var(--wait);color:#241a05;border-color:var(--wait)}
  .dbtn #dlgYes:disabled{background:var(--panel2);color:#4f5a67;border-color:var(--line);cursor:default}
  .dbtn button:active{filter:brightness(.9)}

  .toast{
    position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);
    background:var(--panel2);border:1px solid var(--line);
    padding:9px 15px;border-radius:99px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.2s;z-index:40;white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .hide{display:none !important}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="toprow">
      <div class="nav">
        <button type="button" id="menuBtn" aria-label="메뉴"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <span class="date num" id="dateLabel"></span>
      </div>
      <div class="tools">
        <span class="dayprog num hide" id="dayProg"></span>
        <div class="sync" id="sync"><span class="dot stale" id="dot"></span><span id="syncTxt">연결 안 됨</span></div>
        <button type="button" id="searchBtn" class="off" aria-label="이름 검색">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/>
          </svg>
        </button>
      </div>
    </div>

import { getDatabase, ref, get, set, remove, onValue, off, goOffline, goOnline }
  from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA62A2jtIE77DgOcJ17Jb6S9gH4oTeNeKw",
  authDomain: "ikseon-reserve.firebaseapp.com",
  databaseURL: "https://ikseon-reserve-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ikseon-reserve",
  storageBucket: "ikseon-reserve.firebasestorage.app",
  messagingSenderId: "456621961785",
  appId: "1:456621961785:web:a2ba82fb70d6f198b5d3e8"
};

const db = getDatabase(initializeApp(firebaseConfig));
const path = k => 'roster/' + String(k).replace('roster:', '');

window.__fb = {
  get: k => get(ref(db, path(k))).then(s => s.exists() ? s.val() : null),
  set: (k, v) => set(ref(db, path(k)), v),
  remove: ds => remove(ref(db, 'roster/' + ds)),
  list: () => get(ref(db, 'roster')).then(s => s.exists() ? Object.keys(s.val()) : []),
  watch: (k, cb) => {
    const r = ref(db, path(k));
    const h = onValue(r, s => cb(s.exists() ? s.val() : null));
    return () => off(r, 'value', h);
  },
  // Firebase가 알려주는 실제 연결 상태
  onConnected: cb => onValue(ref(db, '.info/connected'), s => cb(s.val() === true)),
  // 연결이 죽었을 때 소켓을 끊었다 다시 붙인다
  reconnect: () => { try { goOffline(db); } catch(e){} setTimeout(() => { try { goOnline(db); } catch(e){} }, 150); }
};
window.dispatchEvent(new Event('fb-ready'));

<script>
(function(){
  'use strict';

  var DAY_ROLLOVER = 0; // 자정에 날짜가 바뀐다 (마감이 자정을 넘기면 이 값을 올릴 것)
  var state = null;      // {date, rosterTs, items:[]}
  var openMenu = null;
  var editing = null;
  var collapsed = {}; // 시간대별 수동 접기 상태 (미설정이면 자동)
  var touched = {};   // 시간대별 마지막 체크 시각
  var COLLAPSE_DELAY = 3000;
  var query = '';

  // 자동 접힘: 남은 팀이 없고 + 그 시간대가 이미 지났을 때.
  // 단, 방금 체크한 직후에는 눈앞에서 접히지 않도록 잠깐 열어둔다.
  // collapsed[time] = { v: 접힘여부, done: 그때 이 시간대가 끝난 상태였나 }
  // 손으로 접은 건 계속 유지.
  // 손으로 편 건 유지하되, 그 뒤에 시간대가 "끝남"으로 바뀌면 자동 정리에 넘긴다.
  function isCollapsed(time, pendCount, live){
    var done = (pendCount === 0 && !live);
    var o = collapsed[time];
    if (o){
      if (o.v) return true;                 // 수동 접기 — 항상 유지
      if (!(done && !o.done)) return false; // 수동 펼치기 — 상태가 그대로면 유지
    }
    if (!done) return false;
    return Date.now() - (touched[time] || 0) > COLLAPSE_DELAY;
  }
  function setCollapsed(time, v, done){ collapsed[time] = { v: v, done: done }; }
  var saving = false, dirty = false;

  /* ---------- 날짜 ---------- */
  var KEEP_DAYS = 2; // 오늘 기준 이보다 오래된 날짜는 삭제

  function pad(n){ return (n<10?'0':'') + n; }
  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }

  // 오늘의 영업일 (새벽 5시 이전은 전날로 취급)
  function bizDate(){
    var d = new Date();
    if (d.getHours() < DAY_ROLLOVER) d.setDate(d.getDate() - 1);
    return ymd(d);
  }
  function shiftDate(ds, n){
    var p = ds.split('-');
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    d.setDate(d.getDate() + n);
    return ymd(d);
  }
  function dayGap(ds){ // viewDate가 오늘로부터 며칠 떨어져 있나
    var a = bizDate().split('-'), b = ds.split('-');
    var t1 = new Date(+a[0], +a[1]-1, +a[2]).getTime();
    var t2 = new Date(+b[0], +b[1]-1, +b[2]).getTime();
    return Math.round((t2 - t1) / 86400000);
  }

  var viewDate = bizDate();
  function key(){ return 'roster:' + viewDate; }

  function prettyDate(){
    var p = viewDate.split('-');
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    var w = ['일','월','화','수','목','금','토'][d.getDay()];
    var g = dayGap(viewDate);
    var label = g === 0 ? '오늘' : g === -1 ? '어제' : g === 1 ? '내일' : '';
    return p[1] + '월 ' + p[2] + '일 (' + w + ')' + (label ? ' · ' + label : '');
  }

  // 오래된 날짜 정리
  function purgeOld(){
    if (!hasStore()) return;
    var limit = shiftDate(bizDate(), -KEEP_DAYS);
    fb().list().then(function(keys){
      (keys || []).forEach(function(ds){
        if (/^\d{4}-\d{2}-\d{2}$/.test(ds) && ds < limit) fb().remove(ds).catch(function(){});
      });
    }).catch(function(){});
  }

  /* ---------- 파싱 ---------- */
  function parse(text){
    var lines = String(text).split(/\r?\n/);
    var out = [], bad = [], seen = {};
    for (var i=0;i<lines.length;i++){
      var line = lines[i].replace(/\s+/g,' ').trim();
      if (!line) continue;
      var m = line.match(/^(\d{1,2})\s*[:.시]\s*(\d{1,2})?\s*분?\s+(.+?)\s+(\d+)\s*명\s*(.*)$/);
      if (!m){ bad.push({ no: i+1, text: line }); continue; }
      var time = pad(+m[1]) + ':' + pad(+(m[2]||0));
      var name = m[3].trim();
      var pax  = parseInt(m[4],10);
      var tail = (m[5]||'').trim();
      var status = 'pending';
      if (tail === '취소') status = 'cancelled';
      else if (tail === '방문') status = 'arrived';
      else if (tail){ bad.push({ no: i+1, text: line }); continue; }  // 뒤에 붙은 알 수 없는 말
      var hh = +m[1], mm = +(m[2]||0);
      if (hh > 23 || mm > 59 || pax < 1){ bad.push({ no: i+1, text: line }); continue; }
      var base = time + '|' + name + '|' + pax;
      seen[base] = (seen[base]||0) + 1;
      out.push({ id: base + '|' + seen[base], time:time, name:name, pax:pax, status:status, ts:0, seq: out.length });
    }
    out.bad = bad;
    return out;
  }

  function sortItems(a,b){
    if (a.time !== b.time) return a.time < b.time ? -1 : 1;
    return (a.seq||0) - (b.seq||0);
  }

  /* ---------- 저장소 (Firebase Realtime Database) ---------- */
  function fb(){ return window.__fb; }
  function hasStore(){ return !!fb(); }

  function loadRemote(){
    if (!hasStore()) return Promise.resolve(null);
    return fb().get(key()).catch(function(){ return null; });
  }

  function writeRemote(data){
    if (!hasStore()) return Promise.resolve(data);
    return fb().set(key(), data).then(function(){ return data; });
  }

  // 다른 기기의 변경을 즉시 받아온다
  var unwatch = null;
  function watchRemote(){
    if (unwatch){ unwatch(); unwatch = null; }
    if (!hasStore()) return;
    unwatch = fb().watch(key(), function(remote){
      if (saving) return;
      // remote가 비어 있어도(명단 초기화) 그대로 반영해야 한다
      var merged = merge(remote || { date: viewDate, rosterTs: 0, items: [] }, state);
      if (JSON.stringify(merged) === JSON.stringify(state)) return;
      state = merged;
      if (!editing) render();
    });
  }

  // Firebase는 빈 배열·빈 객체를 저장하지 않으므로 items가 사라져서 돌아올 수 있다.
  function norm(d){
    if (!d) return null;
    return { date: d.date, rosterTs: d.rosterTs || 0, items: Array.isArray(d.items) ? d.items : [] };
  }

  function merge(a, b){
    a = norm(a); b = norm(b);
    if (!a) return b;
    if (!b) return a;
    var base  = (a.rosterTs||0) >= (b.rosterTs||0) ? a : b;
    var other = base === a ? b : a;
    var map = {};
    other.items.forEach(function(it){ map[it.id] = it; });
    var items = base.items.map(function(it){
      var o = map[it.id];
      if (o && (o.ts||0) > (it.ts||0)) {
        return { id:it.id, time:it.time, name:it.name, pax:it.pax, seq:it.seq, status:o.status, ts:o.ts };
      }
      return it;
    });
    return { date: base.date, rosterTs: base.rosterTs, items: items };
  }

  function sync(){
    return loadRemote().then(function(remote){
      var merged = merge(remote, state);
      var changed = JSON.stringify(merged) !== JSON.stringify(state);
      state = merged;
      if (changed && !editing) render();
    }).catch(function(){});
  }

  var saveTimer = null;
  function save(){
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 250);
  }
  function flush(){
    if (saving || !state) return;
    saving = true; dirty = false;
    loadRemote().then(function(remote){
      var merged = merge(remote, state);
      state = merged;
      return writeRemote(merged);
    }).then(function(){
      saving = false; render();
      if (dirty) flush();
    }).catch(function(){
      saving = false;
      toast('저장 실패 — 잠시 뒤 다시 시도합니다');
      setTimeout(flush, 3000);
    });
  }

  // 연결 표시는 Firebase가 알려주는 실제 상태만 반영한다.
  // 개별 읽기·쓰기 실패로는 켜지 않는다 — 잠깐 끊겼다 붙는 동안 계속 떠 있게 되므로.
  var online = false;
  function setSync(ok){
    if (ok !== undefined) online = ok;
    var box = document.getElementById('sync');
    var dot = document.getElementById('dot');
    var txt = document.getElementById('syncTxt');
    var ready = online && hasStore();
    box.className = 'sync' + (ready ? ' hide' : '');
    dot.className = 'dot' + (ready ? '' : ' stale');
    txt.textContent = ready ? '연결됨' : '연결 안 됨';
    var cf = document.getElementById('dwConn');
    if (cf){
      cf.className = 'dwfoot' + (ready ? '' : ' off');
      cf.innerHTML = '<span class="dot' + (ready ? '' : ' stale') + '"></span>'
        + (ready ? '연결됨' : '연결 안 됨');
    }
  }

  /* ---------- 렌더 ---------- */
  // 시간대별 마감 기준
  //  - 정각(00분) 예약: 10분 59.999초까지 유지 → 11분 정각에 다음으로
  //  - 비정각 예약   : 3분 59.999초까지 유지  → 4분 정각에 다음으로
  var GRACE_ON_HOUR = 11, GRACE_OFF_HOUR = 4;

  function nowMin(){
    var d = new Date();
    return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60 + d.getMilliseconds()/60000;
  }
  function slotMin(hm){
    var p = hm.split(':');
    return (+p[0])*60 + (+p[1]);
  }
  function slotLive(hm, now){
    var m = slotMin(hm);
    var grace = (m % 60 === 0) ? GRACE_ON_HOUR : GRACE_OFF_HOUR;
    return now < m + grace;
  }

  function render(){
    document.getElementById('dateLabel').textContent = prettyDate();
    var list = document.getElementById('list');
    var all = state ? state.items.slice().sort(sortItems) : [];
    var q = (query || '').trim().toLowerCase();
    var items = q
      ? all.filter(function(it){ return it.name.toLowerCase().indexOf(q) !== -1; })
      : all;

    var qc = document.getElementById('qCount');
    if (q){
      qc.classList.remove('hide');
      qc.className = 'qcount' + (items.length ? '' : ' zero');
      qc.textContent = items.length + '건';
    } else {
      qc.classList.add('hide');
    }

    // 시간대 묶기 — 표시용은 검색 결과, 계산용(allGroups)은 전체
    function groupBy(arr){
      var gs = [], gi = {};
      arr.forEach(function(it){
        if (gi[it.time] === undefined){ gi[it.time] = gs.length; gs.push({time:it.time, items:[]}); }
        gs[gi[it.time]].items.push(it);
      });
      return gs;
    }
    var groups = groupBy(items);
    var allGroups = q ? groupBy(all) : groups;

    // 다음 시간대 — 아직 마감되지 않았고 남은 팀이 있는 첫 시간대 (오늘일 때만)
    var now = nowMin(), nowTime = null;
    if (dayGap(viewDate) === 0){
      for (var i=0;i<allGroups.length;i++){
        if (!slotLive(allGroups[i].time, now)) continue;
        if (allGroups[i].items.some(function(x){ return x.status==='pending'; })){ nowTime = allGroups[i].time; break; }
      }
    }

    // 헤더 — 검색과 무관하게 항상 전체 기준
    var gap = dayGap(viewDate);
    var slotPend = [];
    if (nowTime){
      allGroups.forEach(function(g){
        if (g.time === nowTime) slotPend = g.items.filter(function(x){ return x.status==='pending'; });
      });
    }
    var leadRow = document.querySelector('.lead');
    var st = document.getElementById('slotTime');
    var lb = document.querySelector('.slotlab');
    var lm = document.getElementById('leadMain');
    var ls = document.getElementById('leadSub');

    if (slotPend.length){
      st.textContent = nowTime;
      lb.textContent = '예약';
      lm.className = 'leadmain num';
      lm.textContent = slotPend.length + '팀';
      var byPax = {};
      slotPend.forEach(function(x){ byPax[x.pax] = (byPax[x.pax]||0) + 1; });
      ls.innerHTML = Object.keys(byPax).map(Number).sort(function(a,b){ return a-b; })
        .map(function(p){ return '<span class="pc">' + p + '인 ' + byPax[p] + '팀</span>'; })
        .join('<span class="pcsep"> · </span>');
    } else if (gap !== 0 && all.length){
      // 어제/내일 — 시간대 강조 대신 하루 총 팀수
      st.textContent = '';
      lb.textContent = '';
      lm.className = 'leadmain num';
      lm.textContent = all.length + '팀';
      ls.textContent = '';
    } else {
      st.textContent = '';
      lb.textContent = '';
      lm.className = 'leadmain num done';
      lm.textContent = all.length ? '남은 예약 없음' : '';
      ls.textContent = '';
    }

    if (leadRow) leadRow.classList.toggle('hide', !st.textContent && !lm.textContent);

    // 명단이 없으면 하단 메뉴와 검색은 할 일이 없다
    var footEl = document.querySelector('.foot');
    if (footEl) footEl.classList.toggle('hide', !all.length);
    document.body.style.paddingBottom = all.length ? '' : '24px';
    searchBtn.classList.toggle('off', !all.length);
    if (!all.length && !searchbar.classList.contains('hide')) closeSearch(false);

    // 날짜 / 하루 진행 (분모는 취소 포함 전체)
    var doneN = 0, offN = 0;
    all.forEach(function(it){
      if (it.status === 'arrived') doneN++;
      else if (it.status === 'cancelled') offN++;
    });
    document.getElementById('dateLabel').textContent = prettyDate();
    var dp = document.getElementById('dayProg');
    dp.textContent = (doneN + offN) + '/' + all.length;
    dp.className = 'dayprog num' + (all.length ? '' : ' hide')
      + (all.length && doneN + offN === all.length ? ' full' : '');

    // 날짜 표시 / 이동 버튼
    document.body.classList.toggle('offday', gap !== 0);
    renderDrawerDays();

    // 목록
    list.innerHTML = '';
    var em = document.getElementById('emptyMsg');
    if (!items.length){
      if (q){
        em.classList.remove('hide');
        em.textContent = '「' + query.trim() + '」와(과) 일치하는 예약이 없습니다.';
      } else {
        em.classList.add('hide');
        if (state && panel.classList.contains('hide')) openPaste(false, true);
      }
      return;
    }
    em.classList.add('hide');

    // 다른 기기에서 명단이 들어오면 이쪽 붙여넣기 창은 닫는다.
    // 단, 내가 직접 입력하던 중이면 건드리지 않는다.
    if (!panel.classList.contains('hide') && !appendMode && !ta.value.trim()) closePaste();

    var openCount = 0;
    groups.forEach(function(g, idx){
      var pend = g.items.filter(function(x){ return x.status==='pending'; });
      var came = g.items.filter(function(x){ return x.status==='arrived'; }).length;
      var off  = g.items.filter(function(x){ return x.status==='cancelled'; }).length;
      var tot  = g.items.length;
      var stillLive = (gap === 0) && slotLive(g.time, now);
      var shut = q ? false : isCollapsed(g.time, pend.length, stillLive);

      var wrap = document.createElement('section');
      wrap.className = 'group' + (g.time === nowTime ? ' now' : (pend.length ? '' : ' done')) + (shut ? ' shut' : '');

      var head = document.createElement('button');
      head.className = 'ghead';
      head.type = 'button';
      head.innerHTML = '<span class="chev"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L16 12 L9 19"/></svg></span>'
        + '<span class="gtime num">' + g.time + '</span>'
        + '<span class="gline"></span>'
        + '<span class="gmeta num">'
        +   '<b>' + (came + off) + '/' + tot + '</b>'

      head.addEventListener('click', function(){

        // 접을 때는 그 시간대에서 열려 있던 수정 폼·메뉴를 닫는다
        if (willShut){
          var inHere = function(id){
            return g.items.some(function(x){ return x.id === id; });
          };
          if (editing && inHere(editing)) editing = null;
          if (openMenu && inHere(openMenu)) openMenu = null;
        }
        setCollapsed(g.time, willShut, pend.length === 0 && !stillLive);
        render();
      });
      wrap.appendChild(head);

      if (!shut) g.items.forEach(function(it){ wrap.appendChild(rowEl(it)); });
      list.appendChild(wrap);
      openCount += shut ? 0 : 1;
    });

    var fb = document.getElementById('foldBtn');

    if (hd) document.documentElement.style.setProperty('--hh', hd.offsetHeight + 'px');
  }

  function rowEl(it){

      var mOpts = '';

      form.innerHTML = '<div class="erow">'
        + '<label>시<select id="e-hour">' + hOpts + '</select></label>'

        + '</div>'
        + '<div class="ebtn"><button type="button" id="e-ok">저장</button>'
        + '<button type="button" id="e-no">취소</button></div>';
      body.appendChild(form);
      // 영업시간 밖이거나 5분 단위가 아닌 예약이면 그 값도 목록에 넣어준다
      var curH = it.time.slice(0,2), curM = it.time.slice(3,5);
      var hSel = form.querySelector('#e-hour'), mSel = form.querySelector('#e-min');
      function ensureOpt(sel, v){
        if ([].some.call(sel.options, function(o){ return o.value === v; })) return;
        var o = document.createElement('option');
        o.value = v; o.textContent = v;

  // "1530" "15:30" "15시30분" "15.30" → "15:30"
  function normTime(v){
    var s = String(v).replace(/\s/g,'');
    var m = s.match(/^(\d{1,2})[:.시]?(\d{1,2})?분?$/);
    if (!m) return null;
    var h = +m[1], mi = m[2] === undefined ? 0 : +m[2];
    if (m[2] === undefined && s.length === 4){ h = +s.slice(0,2); mi = +s.slice(2); }
    if (h > 23 || mi > 59) return null;
    return pad(h) + ':' + pad(mi);
  }

  function uniqueId(time, name, pax, skipId){
    var base = time + '|' + name + '|' + pax, n = 0, id;
    do { n++; id = base + '|' + n; }
    while (state.items.some(function(x){ return x.id === id && x.id !== skipId; }));
    return id;
  }

  function applyEdit(id, timeV, nameV, paxV){
    var it = find(id);
    if (!it) return;
    var time = normTime(timeV);
    var name = String(nameV).replace(/\s+/g,' ').trim();
    var pax = parseInt(paxV, 10);
    if (!time){ toast('시간 형식을 확인해 주세요'); return; }
    if (!name){ toast('이름을 입력해 주세요'); return; }
    if (!(pax > 0)){ toast('인원을 확인해 주세요'); return; }

    if (time === it.time && name === it.name && pax === it.pax){ editing = null; render(); return; }

    // 시간이 바뀌면 옮겨간 시간대의 맨 뒤로
    if (time !== it.time){
      var maxSeq = 0;
      state.items.forEach(function(x){ if ((x.seq||0) > maxSeq) maxSeq = x.seq||0; });
      it.seq = maxSeq + 1;
    }

    it.time = time; it.name = name; it.pax = pax;
    it.id = uniqueId(time, name, pax, id);
    state.items.sort(sortItems);
    state.rosterTs = Date.now();
    editing = null;
    render();
    save();
    toast('수정됨');
  }

  function find(id){
    for (var i=0;i<state.items.length;i++) if (state.items[i].id === id) return state.items[i];
    return null;
  }
  function toggle(id){
    var it = find(id);
    if (!it) return;
    setStatus(id, it.status === 'arrived' ? 'pending' : 'arrived');
  }
  function setStatus(id, st){
    var it = find(id);
    if (!it) return;
    it.status = st;
    it.ts = Date.now();
    touched[it.time] = Date.now();
    openMenu = null;
    render();
    save();
    // 접힘 유예가 끝나는 시점에 한 번 더 그려준다
    setTimeout(render, COLLAPSE_DELAY + 100);
    if (st === 'arrived') toast(it.name + ' 방문 체크');
  }

  /* ---------- 명단 등록 ---------- */
  var badBox = document.getElementById('badBox');
  var hl = document.getElementById('hl');
  var taEl = document.getElementById('ta');
  var marking = false;   // 오류 표시 중인지

  function esc(t){
    return t.replace(/[<>&]/g, function(c){ return { '<':'&lt;', '>':'&gt;', '&':'&amp;' }[c]; });
  }
  // 입력칸은 화면 높이의 절반까지만 늘리고, 그 이상은 안에서 스크롤한다.
  // 오버레이(오류 표시)도 같은 위치로 따라가야 줄이 어긋나지 않는다.
  // 입력칸 기본 높이 = 카드 위쪽(제목·안내)과 아래 버튼을 뺀 나머지.
  // 명단이 없을 때 화면이 허전하지 않고, 등록 버튼이 하단 메뉴 근처에 오게 된다.
  // 키보드가 올라올 자리를 남겨 버튼이 가려지지 않도록 여유를 둔다.
  // 비어 있든 가득 차든 같은 높이 — 화면의 약 46%.
  // 등록 버튼이 늘 같은 자리에 있고, 키보드가 올라올 공간도 남는다.
  function taBaseHeight(){
    var vh = window.innerHeight || 700;
    return Math.max(260, Math.min(Math.round(vh * 0.46), 420));
  }
  function autoGrow(){
    var h = taBaseHeight();
    taEl.style.height = h + 'px';
    taEl.style.overflowY = (taEl.scrollHeight > h + 2) ? 'auto' : 'hidden';
    hl.scrollTop = taEl.scrollTop;
  }
  window.addEventListener('resize', function(){
    var pnl = document.getElementById('pastePanel');
    if (pnl && !pnl.classList.contains('hide')) autoGrow();
  });
  function clearBad(){
    marking = false;
    badBox.classList.add('hide');
    hl.innerHTML = '';
  }
  // 지금 커서가 있는 줄 번호 (1부터)
  function caretLine(){
    var pos = taEl.selectionStart;
    if (pos === null || pos === undefined) return -1;
    return String(taEl.value).slice(0, pos).split(/\r?\n/).length;
  }
  function paintBad(bad, skipLine){
    var nos = {};
    bad.forEach(function(b){ if (b.no !== skipLine) nos[b.no] = true; });
    hl.innerHTML = String(taEl.value).split(/\r?\n/).map(function(line, i){
      var t = esc(line) || ' ';
      return '<span class="ln' + (nos[i+1] ? ' err' : '') + '">' + t + '</span>';
    }).join('');
  }
  function showBad(bad){
    marking = true;
    paintBad(bad, -1);
    badBox.textContent = '표시된 줄을 양식에 맞게 고쳐 주세요';
    badBox.classList.remove('hide');
    autoGrow();
  }
  // 표시 중일 때는 입력할 때마다 다시 검사한다.
  // 고친 줄만 표시가 사라지고, 나머지는 그대로 남는다.
  var recheckTimer = null;
  function recheck(skipCaret){
    if (!marking) return;
    var bad = parse(taEl.value).bad;
    if (!bad.length){ clearBad(); return; }
    paintBad(bad, skipCaret ? caretLine() : -1);
  }
  taEl.addEventListener('input', function(){
    autoGrow();
    clearTimeout(recheckTimer);
    recheckTimer = setTimeout(function(){ recheck(true); }, 180);
  });
  // 입력칸을 벗어나면 치던 줄도 다시 검사한다
  taEl.addEventListener('scroll', function(){ hl.scrollTop = taEl.scrollTop; });

  // 붙여넣으면 커서가 맨 끝으로 가면서 입력칸과 화면이 같이 밀려 올라간다.
  // 명단은 위에서부터 확인하는 게 자연스러우니 처음으로 되돌린다.
  taEl.addEventListener('paste', function(){
    setTimeout(function(){
      autoGrow();
      try { taEl.setSelectionRange(0, 0); } catch(e){}
      taEl.scrollTop = 0;
      hl.scrollTop = 0;
      if (!panel.classList.contains('asSheet')) window.scrollTo(0, 0);
    }, 0);
  });
  taEl.addEventListener('blur', function(){
    clearTimeout(recheckTimer);
    recheck(false);
  });

  function applyPaste(text, append){
    var fresh = parse(text);
    if (fresh.bad.length){ showBad(fresh.bad); return false; }
    clearBad();
    if (!fresh.length){ toast('읽을 수 있는 줄이 없습니다'); return false; }
    var items, added = fresh.length;
    if (append && state){
      var exist = {};
      var maxSeq = 0;
      state.items.forEach(function(it){
        exist[it.id] = true;
        if ((it.seq||0) > maxSeq) maxSeq = it.seq||0;
      });
      items = state.items.slice();
      added = 0;
      fresh.forEach(function(it){
        if (exist[it.id]) return;
        it.seq = ++maxSeq;
        items.push(it);
        added++;
      });
      if (!added){ toast('이미 등록된 예약입니다'); return false; }
    } else {
      items = fresh;
    }
    state = { date: viewDate, rosterTs: Date.now(), items: items.sort(sortItems) };
    render();
    flush();
    toast(added + '건 등록');
    return true;
  }

  /* ---------- UI 연결 ---------- */
  var panel = document.getElementById('pastePanel');
  var panelScrim = document.getElementById('panelScrim');
  panelScrim.addEventListener('click', closePaste);
  var ta = document.getElementById('ta');
  var appendMode = false;

  function openPaste(append, silent){
    appendMode = append;
    var g = dayGap(viewDate);
    var day = g === 1 ? '내일' : g === -1 ? '어제' : '오늘';
    document.getElementById('pasteTitle').textContent = append ? '예약 추가' : (day + ' 예약 명단 붙여넣기');
    // 명단이 아예 없을 땐 돌아갈 화면이 없으므로 취소 버튼을 숨긴다
    var hasItems = !!(state && state.items && state.items.length);
    document.getElementById('cancelPaste').classList.toggle('hide', !hasItems);
    ta.value = '';
    clearBad();
    // 「예약 추가」는 별도 팝업으로 띄운다 (본문 흐름을 건드리지 않게)
    panel.classList.toggle('asSheet', !!append);
    panelScrim.classList.toggle('hide', !append);
    autoGrow();
    panel.classList.remove('hide');
    if (silent) return;
    if (!append) panel.scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(function(){ ta.focus(); }, 200);
  }
  function closePaste(){
    panel.classList.add('hide');
    panel.classList.remove('asSheet');
    panelScrim.classList.add('hide');
    appendMode = false;
  }

  var scrim = document.getElementById('scrim');
  function confirmDlg(title, onYes){
    var yes = document.getElementById('dlgYes');
    var no  = document.getElementById('dlgNo');
    var inp = document.getElementById('dlgInput');
    document.getElementById('dlgTitle').textContent = title;
    inp.value = '';
    yes.disabled = true;
    scrim.classList.remove('hide');
    setTimeout(function(){ inp.focus(); }, 150);

    function ok(){ return inp.value.trim() === '예'; }
    function done(){
      scrim.classList.add('hide');
      yes.onclick = null; no.onclick = null; scrim.onclick = null;
      inp.oninput = null; inp.onkeydown = null;
    }
    inp.oninput = function(){ yes.disabled = !ok(); };
    inp.onkeydown = function(e){ if (e.key === 'Enter' && ok()){ done(); onYes(); } };
    yes.onclick = function(){ if (ok()){ done(); onYes(); } };
    no.onclick  = done;
    scrim.onclick = function(e){ if (e.target === scrim) done(); };
  }

  document.getElementById('resetBtn').addEventListener('click', function(){
    if (!state || !state.items.length){ toast('명단이 없습니다'); return; }
    var g = dayGap(viewDate);
    var day = g === 1 ? '내일' : g === -1 ? '어제' : '오늘';
    confirmDlg(day + ' 명단을 초기화할까요?\n「예」를 입력해 주세요', function(){

  document.getElementById('cancelPaste').addEventListener('click', closePaste);
  document.getElementById('addBtn').addEventListener('click', function(){ openPaste(true); });

  /* ---------- 검색 ---------- */
  var qEl = document.getElementById('q');
  var qClear = document.getElementById('qClear');
  var searchbar = document.getElementById('searchbar');
  var searchBtn = document.getElementById('searchBtn');

  /* ---------- 날짜 이동 ---------- */
  function goDate(ds){
    var g = dayGap(ds);
    if (g < -1 || g > 1) return;
    viewDate = ds;
    editing = null; openMenu = null; collapsed = {}; touched = {};
    closeSearch(false);
    state = null;

      state = (remote && remote.items) ? remote : { date: viewDate, rosterTs: 0, items: [] };

      state = { date: viewDate, rosterTs: 0, items: [] };

    var times = {}, anyOpen = false;
    state.items.forEach(function(it){
      if (times[it.time] !== undefined) return;
      var pend = state.items.some(function(x){ return x.time===it.time && x.status==='pending'; });
      var live = (dayGap(viewDate) === 0) && slotLive(it.time, nowMin());
      times[it.time] = (!pend && !live);   // 이 시간대가 끝난 상태인지 기록
      if (!isCollapsed(it.time, pend ? 1 : 0, live)) anyOpen = true;
    });
    Object.keys(times).forEach(function(t){ setCollapsed(t, anyOpen, times[t]); });
    if (anyOpen){ editing = null; openMenu = null; }   // 전부 접을 땐 열린 폼도 닫는다

  // 어제 / 오늘 / 내일 — 건수와 함께
  function renderDrawerDays(){
    var box = document.getElementById('dwDays');
    if (!box) return;
    box.innerHTML = '';
    [-1, 0, 1].forEach(function(off){
      var ds = shiftDate(bizDate(), off);
      var p = ds.split('-');
      var d = new Date(+p[0], +p[1]-1, +p[2]);
      var w = ['일','월','화','수','목','금','토'][d.getDay()];
      var label = off === -1 ? '어제' : off === 0 ? '오늘' : '내일';
      var cur = (ds === viewDate);

      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'dwday' + (cur ? ' on' : '');
      b.innerHTML = '<span class="tick">' + (cur ? '✓' : '') + '</span>'
        + '<span class="d1">' + (+p[1]) + '/' + (+p[2]) + ' (' + w + ') · ' + label + '</span>'
        + '<span class="d2" data-c></span>';
      b.addEventListener('click', function(){ closeDrawer(); if (!cur) goDate(ds); });
      box.appendChild(b);

      var slot = b.querySelector('[data-c]');
      if (cur){
        slot.textContent = (state && state.items.length) ? state.items.length + '건' : '—';
      } else if (hasStore()) {
        fb().get('roster:' + ds).then(function(r){
          slot.textContent = (r && r.items && r.items.length) ? r.items.length + '건' : '—';
        }).catch(function(){ slot.textContent = '—'; });
      } else {
        slot.textContent = '—';
      }
    });
    var cf = document.getElementById('dwConn');
    if (cf){
      cf.className = 'dwfoot' + (online && hasStore() ? '' : ' off');
      cf.innerHTML = '<span class="dot' + (online && hasStore() ? '' : ' stale') + '"></span>'
        + (online && hasStore() ? '연결됨' : '연결 안 됨');
    }
  }

  /* ---------- 안내 시트 ---------- */
  var sheetScrim = document.getElementById('sheetScrim');
  function openSheet(title, html){
    document.getElementById('sheetTitle').textContent = title;
    document.getElementById('sheetBody').innerHTML = html;
    sheetScrim.classList.remove('hide');
  }
  function closeSheet(){ sheetScrim.classList.add('hide'); }
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  sheetScrim.addEventListener('click', function(e){ if (e.target === sheetScrim) closeSheet(); });

  document.getElementById('faqBtn').addEventListener('click', function(){
    closeDrawer();
    openSheet('자주 묻는 질문',
      '<div class="qa"><div class="q">상단 시간은 언제 넘어가나요?</div>'
      + '<div class="a">정각 예약은 11분, 그 외에는 4분이 지나면 다음 시간대로 넘어갑니다.\n'
      + '15:00 예약은 15:11에, 15:20 예약은 15:24에.\n'
      + '그 전이라도 다 체크하면 바로 넘어갑니다.</div></div>'
      + '<div class="qa"><div class="q">날짜는 언제 바뀌나요?</div>'
      + '<div class="a">자정에 바뀝니다.\n'
      + '어제 명단은 왼쪽 위 메뉴에서 볼 수 있고, 이틀 지나면 삭제됩니다.</div></div>'
      + '<div class="qa"><div class="q">다른 사람이 체크한 게 바로 보이나요?</div>'
      + '<div class="a">네. 누가 체크하면 1초 안에 반영됩니다.\n'
      + '연결이 끊기면 상단에 빨갛게 표시되고, 그동안 체크한 것도 다시 연결되면 올라갑니다.</div></div>');
  });

  document.getElementById('installBtn').addEventListener('click', function(){
    closeDrawer();
    var standalone = false;
    try {
      standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
        || window.navigator.standalone === true;
    } catch(e){}
    if (standalone){
      openSheet('앱으로 설치하기', '<p class="sheetNote">이미 앱으로 실행 중입니다.</p>');
      return;
    }
    openSheet('앱으로 설치하기',
      '<div class="howto"><div class="h">아이폰 · 사파리</div>'
      + '<div class="s">하단 <b>⋯</b> → <b>공유</b> → <b>홈 화면에 추가</b></div></div>'
      + '<div class="howto"><div class="h">갤럭시 · 크롬</div>'
      + '<div class="s">우측 위 <b>⋮</b> → <b>설치 및 바로가기 만들기</b> → <b>설치</b></div></div>');
  });

  function reloadPage(){ try { window.location.reload(); } catch(e){} }

  var refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.addEventListener('click', function(){
    // 연결이 끊긴 상태면 데이터를 다시 읽어봐야 소용없다. 연결 자체를 되살린다.
    if (!online && hasStore() && fb().reconnect){
      toast('다시 연결 중…');
      fb().reconnect();
      watchRemote();
      // 그래도 안 붙으면 페이지를 새로 띄우는 수밖에 없다
      setTimeout(function(){
        if (online){ sync(); return; }
        toast('연결 실패 — 화면을 새로 불러옵니다');
        setTimeout(function(){ reloadPage(); }, 900);
      }, 5000);
      return;
    }
    if (!state){ toast('명단이 없습니다'); return; }
    sync().then(function(){ toast('최신 상태'); });
  });

  // 보고용 텍스트 — 체크 안 된 건 뒤에 아무것도 안 붙임
  function reportText(){
    if (!state || !state.items.length) return '';
    var prev = null, out = [];
    state.items.slice().sort(sortItems).forEach(function(it){
      if (prev !== null && it.time !== prev) out.push('');
      prev = it.time;
      var tail = it.status === 'arrived' ? ' 방문'
               : it.status === 'cancelled' ? ' 취소' : '';
      out.push(it.time + ' ' + it.name + ' ' + it.pax + '명' + tail);
    });
    return out.join('\n');
  }

  document.getElementById('copyBtn').addEventListener('click', function(){
    var txt = reportText();
    if (!txt){ toast('명단이 없습니다'); return; }
    var done = function(){ toast(state.items.length + '건 복사됨'); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(function(){ fallbackCopy(txt, done); });
    } else {
      fallbackCopy(txt, done);
    }
  });

  function fallbackCopy(txt, done){
    var t = document.createElement('textarea');
    t.value = txt;
    t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t);
    t.focus(); t.select(); t.setSelectionRange(0, txt.length);
    try { document.execCommand('copy'); done(); }
    catch(e){ toast('복사 실패 — 다시 시도해 주세요'); }
    document.body.removeChild(t);
  }

  var toastTimer;
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1600);
  }

  /* ---------- 시작 ---------- */
  function boot(){
    if (hasStore() && fb().onConnected && !boot._watched){
      boot._watched = true;
      fb().onConnected(function(ok){ setSync(ok); });
    }
    setSync(hasStore());
    purgeOld();
    loadRemote().then(function(remote){
      state = (remote && remote.items) ? remote : { date: viewDate, rosterTs: 0, items: [] };
      render();
      watchRemote();
    }).catch(function(){
      state = { date: viewDate, rosterTs: 0, items: [] };
      render();
    });
  }

  // 화면으로 돌아오면 한 번 확인 (실시간 수신은 watchRemote가 담당)
  document.addEventListener('visibilitychange', function(){
    if (document.hidden || !state) return;
    sync();          // 즉시 최신 상태 확인
    watchRemote();   // 백그라운드에서 끊겼을 수 있으니 실시간 수신도 다시 건다
    // 3초 안에 연결이 안 돌아오면 소켓을 강제로 다시 붙인다
    setTimeout(function(){
      if (!online && hasStore() && fb().reconnect){ fb().reconnect(); watchRemote(); }
    }, 3000);
  });

  // 시간대 자동 전환 + 영업일이 바뀌면 오늘로 복귀
  var lastBiz = bizDate();
  setInterval(function(){
    if (editing) return;
    var b = bizDate();
    if (b !== lastBiz){ lastBiz = b; viewDate = b; collapsed = {}; touched = {}; purgeOld(); boot(); return; }
    render();
  }, 5000);

  // Firebase 모듈이 먼저 준비되면 바로, 아니면 준비 신호를 기다린다
  if (window.__fb) boot();
  else {
    window.addEventListener('fb-ready', boot, { once: true });
    setTimeout(function(){ if (!state) boot(); }, 4000);  // 로딩 실패 시에도 화면은 뜨게
  }
})();
</script>
</body>
</html>
